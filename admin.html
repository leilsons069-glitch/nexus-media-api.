
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS MEDIA - Painel ADM</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#111a2b;border-bottom:1px solid #26344c}
header h1{margin:0;color:#55d6ff;letter-spacing:2px}
header p{color:#9aabc4;margin:7px 0 0}
main{max-width:950px;margin:25px auto;padding:15px}
.card{background:#121c2e;border:1px solid #263852;border-radius:15px;padding:20px;margin-bottom:18px}
h2{margin-top:0;color:#55d6ff}
input,textarea,select{width:100%;padding:13px;margin:7px 0 13px;background:#091322;color:white;border:1px solid #344763;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{padding:12px 17px;border:0;border-radius:8px;background:#16a9d5;color:white;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.5}
.danger{background:#d83d52}
.secondary{background:#344763}
.item{display:flex;gap:14px;align-items:center;border-bottom:1px solid #293950;padding:13px 0}
.item img{width:65px;height:90px;object-fit:cover;border-radius:7px;background:#26344c}
.item-info{flex:1;min-width:0}
.item-info strong{display:block;overflow-wrap:anywhere}
.item-info small{color:#9aabc4}
.actions{display:flex;flex-wrap:wrap}
.hidden{display:none!important}
#mensagem,#loginMsg{padding:10px;color:#55d6ff}
.erro{color:#ff7185!important}
@media(max-width:550px){
.item{align-items:flex-start}
.actions button{padding:9px;font-size:12px}
}
</style>
</head>

<body>
<header>
<h1>NEXUS MEDIA</h1>
<p>Painel de gerenciamento de conteúdo</p>
</header>

<main>

<div class="card" id="login">
<h2>🔐 Acesso administrativo</h2>
<p>Digite sua senha de administrador.</p>
<input type="password" id="token" placeholder="Senha de administrador" autocomplete="current-password">
<button id="entrarBtn" onclick="entrar()">Entrar no painel</button>
<div id="loginMsg"></div>
</div>

<div id="painel" class="hidden">

<div class="card">
<h2 id="formTitulo">＋ Adicionar conteúdo</h2>

<input type="hidden" id="id">

<label>Título</label>
<input id="titulo" placeholder="Nome do filme, série ou anime">

<label>Categoria</label>
<select id="categoria">
<option value="filme">Filme</option>
<option value="serie">Série</option>
<option value="anime">Anime</option>
</select>

<label>Ano</label>
<input id="ano" type="number" placeholder="2026">

<label>Endereço da imagem da capa</label>
<input id="capa" type="url" placeholder="https://site.com/capa.jpg">

<label>Descrição</label>
<textarea id="descricao" placeholder="Descrição do conteúdo..."></textarea>

<button onclick="salvar()">Salvar conteúdo</button>
<button class="secondary" onclick="limpar()">Limpar</button>
</div>

<div class="card">
<h2>🎬 Catálogo</h2>
<input id="busca" placeholder="Buscar conteúdo..." oninput="carregar()">

<select id="filtro" onchange="carregar()">
<option value="">Todas as categorias</option>
<option value="filme">Filmes</option>
<option value="serie">Séries</option>
<option value="anime">Animes</option>
</select>

<div id="lista">Carregando catálogo...</div>
</div>

<button class="danger" onclick="sair()">Sair do painel</button>
</div>

<div id="mensagem"></div>
</main>

<script>
"use strict";

let token = "";
let temporizador = null;

const $ = id => document.getElementById(id);

function mensagem(texto, erro=false){
  $("mensagem").textContent = texto;
  $("mensagem").classList.toggle("erro", erro);
}

async function entrar(){
  const valor = $("token").value.trim();

  if(!valor){
    $("loginMsg").textContent = "Digite sua senha.";
    return;
  }

  const botao = $("entrarBtn");
  botao.disabled = true;
  $("loginMsg").textContent = "Verificando acesso...";

  try{
    const resposta = await fetch("/api/admin/verificar", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + valor
      },
      cache: "no-store"
    });

    if(!resposta.ok){
      $("loginMsg").textContent =
        resposta.status === 401
        ? "Senha incorreta."
        : "Erro ao verificar acesso: " + resposta.status;
      return;
    }

    const dados = await resposta.json();

    if(dados.autenticado !== true){
      $("loginMsg").textContent = "Resposta de autenticação inválida.";
      return;
    }

    token = valor;

    $("login").classList.add("hidden");
    $("painel").classList.remove("hidden");
    $("loginMsg").textContent = "";

    await carregar();

  }catch(e){
    $("loginMsg").textContent = "Erro de conexão com o servidor.";
  }finally{
    botao.disabled = false;
  }
}

function sair(){
  token = "";
  clearTimeout(temporizador);

  $("painel").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("token").value = "";
  $("lista").innerHTML = "";
  mensagem("");
}

async function requisicao(url, opcoes={}){
  const cabecalhos = {
    ...(opcoes.headers || {}),
    "Authorization": "Bearer " + token
  };

  if(opcoes.body){
    cabecalhos["Content-Type"] = "application/json";
  }

  return fetch(url,{
    ...opcoes,
    headers: cabecalhos,
    cache: "no-store"
  });
}

async function carregar(){
  try{
    const busca = $("busca").value.trim();
    const categoria = $("filtro").value;

    const params = new URLSearchParams();

    if(busca) params.set("busca",busca);
    if(categoria) params.set("categoria",categoria);

    const resposta = await requisicao(
      "/api/catalogo?" + params.toString()
    );

    if(resposta.status === 401){
      alert("Sua autorização expirou.");
      sair();
      return;
    }

    if(!resposta.ok){
      throw new Error("Erro ao carregar catálogo.");
    }

    const dados = await resposta.json();

    const itens = Array.isArray(dados)
      ? dados
      : Array.isArray(dados.resultados)
        ? dados.resultados
        : [];

    mostrarLista(itens);

  }catch(e){
    $("lista").textContent = e.message;
  }
}

function mostrarLista(itens){
  const lista = $("lista");
  lista.innerHTML = "";

  if(!itens.length){
    lista.textContent = "Nenhum conteúdo encontrado.";
    return;
  }

  itens.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";

    const img = document.createElement("img");
    img.src = item.capa || "";
    img.alt = "Capa";
    img.onerror = ()=> img.style.display = "none";

    const info = document.createElement("div");
    info.className = "item-info";

    const titulo = document.createElement("strong");
    titulo.textContent = item.titulo || "Sem título";

    const detalhe = document.createElement("small");
    detalhe.textContent =
      (item.categoria || "") + " • " +
      (item.ano || "Ano não informado");

    info.append(titulo,detalhe);

    const acoes = document.createElement("div");
    acoes.className = "actions";

    const editar = document.createElement("button");
    editar.className = "secondary";
    editar.textContent = "Editar";
    editar.onclick = ()=> editarItem(item);

    const excluir = document.createElement("button");
    excluir.className = "danger";
    excluir.textContent = "Excluir";
    excluir.onclick = ()=> excluirItem(item.id);

    acoes.append(editar,excluir);
    div.append(img,info,acoes);
    lista.append(div);
  });
}

function editarItem(item){
  $("id").value = item.id;
  $("titulo").value = item.titulo || "";
  $("categoria").value = item.categoria || "filme";
  $("ano").value = item.ano || "";
  $("capa").value = item.capa || "";
  $("descricao").value = item.descricao || "";

  $("formTitulo").textContent = "✏️ Editar conteúdo";

  window.scrollTo({top:0,behavior:"smooth"});
}

function limpar(){
  ["id","titulo","ano","capa","descricao"].forEach(id=>{
    $(id).value = "";
  });

  $("categoria").value = "filme";
  $("formTitulo").textContent = "＋ Adicionar conteúdo";
}

async function salvar(){
  const id = $("id").value;
  const titulo = $("titulo").value.trim();

  if(!titulo){
    mensagem("Digite o título.",true);
    return;
  }

  const dados = {
    titulo,
    categoria: $("categoria").value,
    ano: $("ano").value ? Number($("ano").value) : null,
    capa: $("capa").value.trim(),
    descricao: $("descricao").value.trim()
  };

  try{
    const resposta = await requisicao(
      id ? "/api/catalogo/" + encodeURIComponent(id)
         : "/api/catalogo",
      {
        method: id ? "PUT" : "POST",
        body: JSON.stringify(dados)
      }
    );

    if(resposta.status === 401){
      sair();
      alert("Acesso não autorizado.");
      return;
    }

    if(!resposta.ok){
      const erro = await resposta.json();
      throw new Error(erro.erro || "Erro ao salvar.");
    }

    mensagem("Conteúdo salvo com sucesso!");
    limpar();
    await carregar();

  }catch(e){
    mensagem(e.message,true);
  }
}

async function excluirItem(id){
  if(!confirm("Deseja realmente excluir este conteúdo?")) return;

  try{
    const resposta = await requisicao(
      "/api/catalogo/" + encodeURIComponent(id),
      {method:"DELETE"}
    );

    if(resposta.status === 401){
      sair();
      alert("Acesso não autorizado.");
      return;
    }

    if(!resposta.ok){
      const erro = await resposta.json();
      throw new Error(erro.erro || "Erro ao excluir.");
    }

    mensagem("Conteúdo excluído.");
    await carregar();

  }catch(e){
    mensagem(e.message,true);
  }
}
</script>
</body>
</html>
