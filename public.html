
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>NEXUS MEDIA</title>

<style>
:root{
  --bg:#08090d;
  --panel:#171923;
  --red:#e50935;
  --text:#fff;
  --muted:#aaa;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;overflow-x:hidden;
}
button,input,select{font:inherit}
button{cursor:pointer}
::selection{background:#e50935;color:white}

header{
  height:72px;padding:0 5%;display:flex;
  align-items:center;justify-content:space-between;
  background:rgba(8,9,13,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--line);
}
.logo{
  color:var(--red);font-size:26px;font-weight:1000;
  letter-spacing:2px;text-shadow:0 0 25px rgba(229,9,53,.3);
}
nav{display:flex;align-items:center;gap:25px}
nav a{
  color:#ddd;text-decoration:none;font-size:14px;
  font-weight:bold;transition:.25s;
}
nav a:hover{color:#ff3158}
nav .admin{
  border:1px solid #454550;padding:10px 17px;
  border-radius:25px;background:#171923;
}
nav .admin:hover{
  background:var(--red);border-color:var(--red);color:white;
}

.hero{
  min-height:510px;padding:65px 7%;
  display:flex;align-items:center;position:relative;
  isolation:isolate;overflow:hidden;
  background:
    linear-gradient(90deg,#08090d 3%,rgba(8,9,13,.88) 40%,rgba(8,9,13,.15) 100%),
    linear-gradient(0deg,#08090d 0%,transparent 55%),
    radial-gradient(circle at 75% 35%,#75142f,#24101d 55%,#08090d);
  background-size:cover;background-position:center;
}
.hero:after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(0deg,#08090d 0%,transparent 35%);
  pointer-events:none;
}
.hero-content{
  max-width:620px;position:relative;z-index:1;
  animation:heroEnter .8s ease both;
}
@keyframes heroEnter{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
.tag{
  color:#ff4566;font-size:12px;letter-spacing:4px;font-weight:900;
}
.hero h1{
  font-size:clamp(38px,7vw,76px);
  line-height:1.02;margin:18px 0;font-weight:1000;
  text-shadow:0 5px 25px #000;
}
.hero p{color:#ddd;line-height:1.8;max-width:540px;font-size:15px}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.primary,.secondary{
  border:0;border-radius:6px;padding:15px 23px;
  font-weight:900;transition:transform .2s,background .2s,box-shadow .2s;
}
.primary{
  background:var(--red);color:white;
  box-shadow:0 7px 25px rgba(229,9,53,.22);
}
.primary:hover{
  background:#ff1748;transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(229,9,53,.35);
}
.secondary{
  background:rgba(255,255,255,.13);color:white;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}
.secondary:hover{
  background:rgba(255,255,255,.23);transform:translateY(-3px);
}

main{padding:30px 5% 70px}
.tools{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px}
.search{
  flex:1;min-width:200px;padding:15px 18px;
  background:#151720;color:white;border:1px solid #30323c;
  border-radius:8px;outline:none;transition:.25s;
}
.search:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(229,9,53,.13);
}
.search::placeholder{color:#777}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{
  background:#171923;color:#ddd;border:1px solid #30323c;
  border-radius:25px;padding:11px 18px;transition:.2s;
}
.filters button:hover{border-color:var(--red);color:white}
.filters button.active{
  background:var(--red);color:white;border-color:var(--red);
  box-shadow:0 4px 15px rgba(229,9,53,.2);
}
.section-title{
  font-size:22px;margin:32px 0 17px;
  font-weight:900;letter-spacing:.2px;
}
.row-catalog{
  display:flex;gap:17px;overflow-x:auto;
  padding:5px 3px 20px;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:#444 transparent;
}
.row-catalog::-webkit-scrollbar{height:5px}
.row-catalog::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
.movie{
  flex:0 0 175px;min-width:0;cursor:pointer;
  position:relative;transition:transform .25s ease;
}
.movie:hover{transform:translateY(-7px) scale(1.025)}
.cover{
  width:100%;aspect-ratio:2/3;object-fit:cover;
  border-radius:10px;
  background:linear-gradient(135deg,#20222c,#11131b);
  display:block;border:1px solid rgba(255,255,255,.07);
  box-shadow:0 7px 20px rgba(0,0,0,.25);
  transition:filter .25s,box-shadow .25s;
}
.movie:hover .cover{
  filter:brightness(1.1);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.movie h3{
  font-size:14px;margin:11px 0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.movie small{color:var(--muted);font-size:12px}
.status{
  text-align:center;padding:45px 15px;color:var(--muted);
  width:100%;line-height:1.8;
}
footer{
  text-align:center;padding:35px;color:#777;
  border-top:1px solid #20222a;font-size:12px;line-height:1.7;
}

.modal{
  display:none;position:fixed;inset:0;z-index:40;
  background:rgba(0,0,0,.94);backdrop-filter:blur(8px);
  overflow-y:auto;padding:20px 12px;
}
.modal.show{display:block;animation:modalEnter .2s ease}
@keyframes modalEnter{from{opacity:0}to{opacity:1}}
.modal-box{
  max-width:900px;margin:15px auto;background:#151720;
  border:1px solid #30323c;border-radius:14px;
  overflow:hidden;box-shadow:0 20px 80px #000;
}
.modal-cover{
  width:100%;height:280px;object-fit:cover;background:#222;
}
.modal-content{padding:24px}
.close{
  float:right;background:#292b35;color:white;border:0;
  border-radius:50%;width:38px;height:38px;font-size:22px;
  transition:.2s;
}
.close:hover{background:var(--red);transform:rotate(90deg)}
.modal-content p{color:#c1c2ca;line-height:1.7}
.modal-content h2{font-size:27px;margin-top:15px}
#detailMeta{color:#aaa}

.player-area{
  margin:22px 0;background:#000;border-radius:10px;
  overflow:hidden;border:1px solid #292b35;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}
.player-area video{
  width:100%;max-height:520px;display:block;background:#000;
}
.player-controls{background:#11131b;padding:13px}
.progress-line{width:100%;margin-bottom:10px}
.progress-line input{width:100%;accent-color:#e50935;cursor:pointer}
.control-row{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.control-row button{
  background:#292b35;color:white;border:0;
  border-radius:6px;padding:10px 13px;transition:.2s;
}
.control-row button:hover{background:var(--red)}
.control-row button:active{transform:scale(.95)}
#timeDisplay{color:#ddd;font-size:12px}
.volume-control{display:flex;align-items:center;gap:5px;color:white}
.volume-control input{width:65px;accent-color:#e50935}
#qualitySelect{
  background:#292b35;color:white;border:1px solid #444;
  border-radius:6px;padding:9px;max-width:120px;
}
.player-message{color:#bbb;text-align:center;padding:13px;font-size:13px}
.season{
  margin-top:17px;background:#20222d;border:1px solid #30323c;
  border-radius:9px;padding:15px;
}
.season h3{margin:0 0 12px}
.episode{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:12px 0;border-top:1px solid #383a45;
  font-size:13px;
}
.watch{
  background:var(--red);color:white;padding:10px 15px;
  border:0;border-radius:6px;white-space:nowrap;
  font-weight:bold;transition:.2s;
}
.watch:hover{background:#ff1748;transform:scale(1.04)}
.notice{
  background:#24202a;border:1px solid #39303e;
  padding:15px;border-radius:8px;color:#c5bdca;
  font-size:13px;line-height:1.6;
}

@media(min-width:1100px){
  .movie{flex-basis:190px}
  .hero{min-height:570px}
}
@media(max-width:600px){
  header{height:62px;padding:0 4%}
  .logo{font-size:18px;letter-spacing:1px}
  nav{gap:11px}
  nav a{font-size:11px}
  nav .admin{padding:8px 11px}
  .hero{min-height:380px;padding:42px 6%}
  .hero h1{font-size:42px}
  .hero p{font-size:13px}
  .tag{font-size:10px;letter-spacing:2px}
  .primary,.secondary{padding:12px 15px;font-size:12px}
  main{padding:23px 4% 50px}
  .tools{gap:10px}
  .search{min-width:100%;padding:13px}
  .filters{gap:6px}
  .filters button{padding:9px 13px;font-size:12px}
  .movie{flex-basis:135px}
  .row-catalog{gap:12px}
  .section-title{font-size:19px}
  .modal-cover{height:175px}
  .modal-content{padding:15px}
  .modal-content h2{font-size:22px}
  .control-row{justify-content:center}
  #timeDisplay{width:100%;text-align:center}
  .episode{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXUS MEDIA</div>
  <nav>
    <a href="#">Início</a>
    <a href="#catalogo">Catálogo</a>
    <a class="admin" href="/admin">Admin</a>
  </nav>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <span class="tag">SEU UNIVERSO DE ENTRETENIMENTO</span>
    <h1 id="heroTitle">NEXUS MEDIA</h1>
    <p id="heroDescription">
      Filmes, séries e animes em um só lugar.
      Escolha seu próximo conteúdo e aproveite.
    </p>
    <div class="hero-buttons">
      <button class="primary" id="heroWatch" onclick="playFeatured()">▶ ASSISTIR</button>
      <button class="secondary" onclick="scrollCatalog()">EXPLORAR CATÁLOGO</button>
    </div>
  </div>
</section>

<main id="catalogo">
  <div class="tools">
    <input id="search" class="search" type="search"
      placeholder="Pesquisar filmes, séries e animes..."
      oninput="renderCatalog()">
    <div class="filters">
      <button class="active" onclick="setFilter('todos',this)">Todos</button>
      <button onclick="setFilter('filme',this)">Filmes</button>
      <button onclick="setFilter('serie',this)">Séries</button>
      <button onclick="setFilter('anime',this)">Animes</button>
    </div>
  </div>
  <div id="catalog">
    <div class="status">Carregando catálogo...</div>
  </div>
</main>

<footer>
  NEXUS MEDIA © <span id="year"></span>
  <br><br>Sua plataforma de entretenimento.
</footer>

<div class="modal" id="detailsModal" onclick="outsideClose(event)">
  <div class="modal-box">
    <img class="modal-cover" id="detailCover" src="" alt="Capa">
    <div class="modal-content">
      <button class="close" onclick="closeDetails()">×</button>
      <h2 id="detailTitle"></h2>
      <small id="detailMeta"></small>
      <p id="detailDescription"></p>

      <div class="player-area" id="playerArea" style="display:none">
        <video id="videoPlayer" playsinline preload="metadata"></video>
        <div class="player-controls">
          <div class="progress-line">
            <input id="seekBar" type="range" min="0" max="1000" value="0">
          </div>
          <div class="control-row">
            <button id="playPause" type="button">▶</button>
            <span id="timeDisplay">00:00 / 00:00</span>
            <button id="backward" type="button">↶ 10s</button>
            <button id="forward" type="button">10s ↷</button>
            <label class="volume-control">
              🔊 <input id="volumeBar" type="range" min="0" max="1" step="0.05" value="1">
            </label>
            <select id="qualitySelect" aria-label="Qualidade">
              <option value="-1">Automática</option>
            </select>
            <button id="fullscreenButton" type="button">⛶</button>
          </div>
        </div>
        <div class="player-message" id="playerMessage">
          Reprodução de vídeo autorizado.
        </div>
      </div>
      <div id="detailSeasons"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

<script>
"use strict";

const API="/api/catalogo";
let catalog=[];
let currentFilter="todos";
let featuredItem=null;
let hlsInstance=null;
let currentVideoKey="";

const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

function safeURL(value){
  if(typeof value!=="string" || !value.trim())return "";
  const clean=value.trim();

  if(/^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(clean)){
    return clean;
  }

  try{
    const url=new URL(clean,window.location.origin);
    if(url.protocol==="https:" || url.protocol==="http:"){
      return url.href;
    }
  }catch(e){}
  return "";
}

async function loadCatalog(){
  const container=$("catalog");
  container.innerHTML='<div class="status">Carregando catálogo...</div>';

  try{
    const response=await fetch(API,{cache:"no-store"});
    if(!response.ok)throw new Error("Erro HTTP: "+response.status);

    const data=await response.json();
    if(!Array.isArray(data))throw new Error("A API não retornou uma lista.");

    catalog=data;
    updateHero();
    renderCatalog();
    console.log("NEXUS MEDIA: catálogo carregado!",catalog);

  }catch(error){
    console.error("Erro ao carregar catálogo:",error);
    container.innerHTML=`
      <div class="status">
        Não foi possível carregar o catálogo.<br>
        ${String(error.message||"Erro desconhecido")}
        <br><br>
        <button class="primary" onclick="loadCatalog()">TENTAR NOVAMENTE</button>
      </div>`;
  }
}

function scrollCatalog(){
  $("catalogo").scrollIntoView({behavior:"smooth"});
}

function getEpisodes(item){
  const seasons=Array.isArray(item.temporadas)?item.temporadas:[];
  return seasons.flatMap(season=>
    Array.isArray(season.episodios)?season.episodios:[]
  );
}

function getVideoLink(episode){
  return episode?.url||episode?.video||episode?.link||"";
}

function updateHero(){
  featuredItem=catalog[0]||null;

  if(!featuredItem){
    $("heroTitle").textContent="NEXUS MEDIA";
    $("heroWatch").style.display="none";
    return;
  }

  $("heroTitle").textContent=featuredItem.titulo||"NEXUS MEDIA";
  $("heroDescription").textContent=
    featuredItem.descricao||"Descubra seu próximo filme ou série.";

  const cover=safeURL(featuredItem.capa);

  if(cover){
    $("hero").style.backgroundImage=
      `linear-gradient(90deg,#08090d 5%,rgba(8,9,13,.85) 55%,rgba(8,9,13,.2)),linear-gradient(0deg,#08090d,transparent 45%),url("${cover}")`;
  }

  const episode=getEpisodes(featuredItem)[0];
  $("heroWatch").style.display=
    safeURL(getVideoLink(episode))?"inline-block":"none";
}

function playFeatured(){
  if(featuredItem)openDetails(featuredItem.id,true);
}

function setFilter(filter,button){
  currentFilter=filter;
  document.querySelectorAll(".filters button")
    .forEach(btn=>btn.classList.remove("active"));
  button.classList.add("active");
  renderCatalog();
}

function createMovieCard(item){
  const card=document.createElement("article");
  card.className="movie";
  card.onclick=()=>openDetails(item.id);

  const img=document.createElement("img");
  img.className="cover";
  img.alt=item.titulo||"Capa";
  img.loading="lazy";

  const cover=safeURL(item.capa);
  if(cover)img.src=cover;
  else img.style.visibility="hidden";

  img.onerror=()=>{img.style.visibility="hidden"};

  const title=document.createElement("h3");
  title.textContent=item.titulo||"Sem título";

  const meta=document.createElement("small");
  meta.textContent=[item.ano,item.categoria].filter(Boolean).join(" • ");

  card.append(img,title,meta);
  return card;
}

function renderCatalog(){
  const container=$("catalog");
  container.innerHTML="";

  const search=$("search").value.toLowerCase().trim();

  const filtered=catalog.filter(item=>{
    const category=String(item.categoria||"").toLowerCase();
    const title=String(item.titulo||"").toLowerCase();

    return (currentFilter==="todos"||category===currentFilter)
      &&title.includes(search);
  });

  if(!filtered.length){
    container.innerHTML='<div class="status">Nenhum título encontrado.</div>';
    return;
  }

  if(currentFilter!=="todos"||search){
    const section=document.createElement("section");
    const heading=document.createElement("h2");
    heading.className="section-title";
    heading.textContent="Resultados";

    const row=document.createElement("div");
    row.className="row-catalog";
    filtered.forEach(item=>row.appendChild(createMovieCard(item)));

    section.append(heading,row);
    container.appendChild(section);
    return;
  }

  [
    {key:"filme",title:"Filmes"},
    {key:"serie",title:"Séries"},
    {key:"anime",title:"Animes"}
  ].forEach(group=>{
    const items=filtered.filter(item=>
      String(item.categoria||"").toLowerCase()===group.key
    );

    if(!items.length)return;

    const section=document.createElement("section");
    const heading=document.createElement("h2");
    heading.className="section-title";
    heading.textContent=group.title;

    const row=document.createElement("div");
    row.className="row-catalog";
    items.forEach(item=>row.appendChild(createMovieCard(item)));

    section.append(heading,row);
    container.appendChild(section);
  });
}

function formatTime(seconds){
  if(!Number.isFinite(seconds))return "00:00";
  const min=Math.floor(seconds/60);
  const sec=Math.floor(seconds%60);
  return String(min).padStart(2,"0")+":"+
    String(sec).padStart(2,"0");
}

function saveProgress(){
  const video=$("videoPlayer");
  if(!currentVideoKey||!Number.isFinite(video.currentTime))return;

  if(video.currentTime>5&&video.duration){
    try{
      localStorage.setItem(
        "nexus_progress_"+currentVideoKey,
        JSON.stringify({time:video.currentTime,duration:video.duration})
      );
    }catch(e){
      console.warn("Não foi possível salvar o progresso.",e);
    }
  }
}

function updateProgress(){
  const video=$("videoPlayer");
  if(!video.duration||!Number.isFinite(video.duration))return;

  $("seekBar").value=(video.currentTime/video.duration)*1000;
  $("timeDisplay").textContent=
    formatTime(video.currentTime)+" / "+formatTime(video.duration);
}

function loadQualities(){
  const select=$("qualitySelect");
  select.innerHTML='<option value="-1">Automática</option>';
  if(!hlsInstance)return;

  const levels=hlsInstance.levels;
  const heights=[
    ...new Set(levels.map(level=>level.height).filter(Boolean))
  ].sort((a,b)=>b-a);

  heights.forEach(height=>{
    const option=document.createElement("option");
    option.value=String(levels.findIndex(level=>level.height===height));
    option.textContent=height+"p";
    select.appendChild(option);
  });
}

function stopPlayer(){
  saveProgress();
  const video=$("videoPlayer");

  if(hlsInstance){
    hlsInstance.destroy();
    hlsInstance=null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  currentVideoKey="";
  $("playerArea").style.display="none";
}

function playVideo(rawURL){
  const url=safeURL(rawURL);
  if(!url){
    alert("Link de vídeo inválido.");
    return;
  }

  stopPlayer();

  const video=$("videoPlayer");
  const message=$("playerMessage");
  currentVideoKey=url;

  $("playerArea").style.display="block";
  message.textContent="Carregando vídeo...";
  $("seekBar").value=0;
  $("timeDisplay").textContent="00:00 / 00:00";
  $("qualitySelect").innerHTML='<option value="-1">Automática</option>';

  let saved=null;
  try{
    saved=localStorage.getItem("nexus_progress_"+currentVideoKey);
  }catch(e){}

  function restoreProgress(){
    if(!saved)return;
    try{
      const progress=JSON.parse(saved);
      if(
        progress.time>5 &&
        Number.isFinite(video.duration) &&
        progress.time<video.duration-5
      ){
        video.currentTime=progress.time;
        message.textContent="Progresso anterior restaurado.";
      }
    }catch(e){}
  }

  const isHLS=/\.m3u8($|\?)/i.test(url);

  video.addEventListener("loadedmetadata",restoreProgress,{once:true});

  if(isHLS&&window.Hls&&Hls.isSupported()){
    hlsInstance=new Hls();
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);

    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      loadQualities();
      message.textContent="Vídeo pronto para reprodução.";
      video.play().catch(()=>{});
    });

    hlsInstance.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal){
        message.textContent="Falha ao reproduzir. Confira o link do vídeo.";
      }
    });
  }else{
    video.src=url;

    video.addEventListener("loadedmetadata",()=>{
      message.textContent="Vídeo pronto para reprodução.";
      video.play().catch(()=>{});
    },{once:true});

    video.addEventListener("error",()=>{
      message.textContent="Falha na reprodução. Confira o link.";
    },{once:true});
  }

  $("playerArea").scrollIntoView({behavior:"smooth",block:"center"});
}

$("playPause").onclick=()=>{
  const video=$("videoPlayer");
  if(video.paused)video.play().catch(()=>{});
  else video.pause();
};

$("videoPlayer").addEventListener("play",()=>{
  $("playPause").textContent="❚❚";
});

$("videoPlayer").addEventListener("pause",()=>{
  $("playPause").textContent="▶";
});

$("videoPlayer").addEventListener("timeupdate",()=>{
  updateProgress();
  saveProgress();
});

$("videoPlayer").addEventListener("ended",()=>{
  if(currentVideoKey){
    try{
      localStorage.removeItem("nexus_progress_"+currentVideoKey);
    }catch(e){}
  }
});

$("seekBar").oninput=()=>{
  const video=$("videoPlayer");
  if(video.duration){
    video.currentTime=(Number($("seekBar").value)/1000)*video.duration;
  }
};

$("volumeBar").oninput=()=>{
  $("videoPlayer").volume=Number($("volumeBar").value);
};

$("backward").onclick=()=>{
  const video=$("videoPlayer");
  video.currentTime=Math.max(0,video.currentTime-10);
};

$("forward").onclick=()=>{
  const video=$("videoPlayer");
  if(Number.isFinite(video.duration)){
    video.currentTime=Math.min(video.duration,video.currentTime+10);
  }
};

$("fullscreenButton").onclick=async()=>{
  const area=$("playerArea");
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(area.requestFullscreen){
      await area.requestFullscreen();
    }else if($("videoPlayer").webkitEnterFullscreen){
      $("videoPlayer").webkitEnterFullscreen();
    }
  }catch(e){}
};

$("qualitySelect").onchange=()=>{
  if(hlsInstance){
    hlsInstance.currentLevel=Number($("qualitySelect").value);
  }
};

function openDetails(id,autoPlay=false){
  const item=catalog.find(movie=>Number(movie.id)===Number(id));
  if(!item)return;

  stopPlayer();

  const cover=safeURL(item.capa);
  $("detailCover").src=cover||"";
  $("detailCover").style.display=cover?"block":"none";

  $("detailTitle").textContent=item.titulo||"Sem título";
  $("detailMeta").textContent=
    [item.ano,item.categoria].filter(Boolean).join(" • ");
  $("detailDescription").textContent=
    item.descricao||"Nenhuma descrição cadastrada.";

  renderSeasons(item.temporadas,item.categoria);

  $("detailsModal").classList.add("show");
  document.body.style.overflow="hidden";

  if(autoPlay){
    const first=getEpisodes(item).find(ep=>safeURL(getVideoLink(ep)));
    if(first){
      setTimeout(()=>playVideo(getVideoLink(first)),250);
    }
  }
}

function renderSeasons(seasons,category){
  const container=$("detailSeasons");
  container.innerHTML="";

  if(!Array.isArray(seasons)||!seasons.length){
    container.innerHTML=
      '<div class="notice">Este título ainda não possui vídeo cadastrado.</div>';
    return;
  }

  seasons.forEach((season,index)=>{
    const box=document.createElement("div");
    box.className="season";

    const heading=document.createElement("h3");
    heading.textContent=category==="filme"
      ?"Reprodução do filme"
      :season.nome||"Temporada "+(season.numero||index+1);

    box.appendChild(heading);

    const episodes=Array.isArray(season.episodios)?season.episodios:[];

    episodes.forEach((episode,episodeIndex)=>{
      const row=document.createElement("div");
      row.className="episode";

      const title=document.createElement("span");
      title.textContent=episode.titulo||
        (category==="filme"
          ?"Assistir filme"
          :"Episódio "+(episode.numero||episodeIndex+1));

      row.appendChild(title);

      const link=safeURL(getVideoLink(episode));

      if(link){
        const button=document.createElement("button");
        button.className="watch";
        button.textContent="▶ Assistir";
        button.onclick=()=>playVideo(link);
        row.appendChild(button);
      }else{
        const unavailable=document.createElement("small");
        unavailable.textContent="Vídeo não cadastrado";
        row.appendChild(unavailable);
      }

      box.appendChild(row);
    });

    container.appendChild(box);
  });
}

function closeDetails(){
  stopPlayer();
  $("detailsModal").classList.remove("show");
  document.body.style.overflow="";
}

function outsideClose(event){
  if(event.target.id==="detailsModal")closeDetails();
}

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&$("detailsModal").classList.contains("show")){
    closeDetails();
  }
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)saveProgress();
});

loadCatalog();
</script>
</body>
</html>
